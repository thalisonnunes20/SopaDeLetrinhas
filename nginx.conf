server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript text/plain;

    # O jogo é só leitura: aceita apenas GET e HEAD
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        deny all;
    }
}
