<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Caça-palavras gratuito para jogar no celular ou no computador. Sem login, sem anúncios: abriu, já tem quebra-cabeça pronto, com dicas das palavras.">
  <meta name="theme-color" content="#f3ead7">
  <title>Caça-Palavras · jogue agora, sem cadastro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f3ead7'/%3E%3Crect x='6' y='24' width='52' height='16' rx='8' fill='%23e8b94a' opacity='.8'/%3E%3Ctext x='32' y='40' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%232a2622'%3ECP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="masthead__title">
        <h1>Caça-Palavras</h1>
        <p class="masthead__sub">Encontre as palavras escondidas na grade</p>
      </div>

      <div class="controls">
        <div class="field">
          <label for="theme">Tema</label>
          <select id="theme"></select>
        </div>
        <div class="field">
          <label for="level">Dificuldade</label>
          <select id="level">
            <option value="facil">Fácil · 8×8</option>
            <option value="medio">Médio · 10×10</option>
            <option value="dificil">Difícil · 12×12</option>
            <option value="experiente">Experiente · 15×15</option>
          </select>
        </div>
        <div class="field">
          <label for="mode">Modo</label>
          <select id="mode">
            <option value="classico">Clássico · → e ↓</option>
            <option value="maluco">Maluco · diagonal e invertido</option>
          </select>
        </div>
        <button type="button" id="new-game" class="btn">Novo jogo</button>
      </div>
    </header>

    <main class="layout">
      <section class="sheet" aria-label="Tabuleiro">
        <div id="board" class="board" role="grid" aria-label="Grade de letras"></div>
        <p class="sheet__tip">Arraste do começo ao fim da palavra, ou toque na primeira e na última letra.</p>
      </section>

      <aside class="clues" aria-label="Palavras para encontrar">
        <div class="clues__head">
          <h2>Palavras</h2>
          <p id="progress" class="clues__count" aria-live="polite"></p>
        </div>
        <ol id="word-list" class="words"></ol>
      </aside>
    </main>

    <footer class="foot">
      Tudo roda no seu aparelho. Nada é enviado para a internet.
    </footer>
  </div>

  <dialog id="win" class="win" aria-labelledby="win-title">
    <h2 id="win-title">Parabéns!</h2>
    <p>Você encontrou todas as palavras.</p>
    <div class="win__actions">
      <button type="button" id="win-new" class="btn">Jogar de novo</button>
      <button type="button" id="win-close" class="btn btn--ghost">Fechar</button>
    </div>
  </dialog>

  <script src="js/words.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
